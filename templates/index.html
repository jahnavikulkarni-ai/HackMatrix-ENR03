<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portable Microplastics Screening System</title>
</head>
<body>
    <h1>HackMatrix 5.0 - ENR-03</h1>
    <h2>Portable Microplastics Screening System</h2>
    
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required>
        <button type="submit">Upload and Process</button>
    </form>

    {% if processed %}
    <h3>Processing Results</h3>
    <div>
        <p>Original Image:</p>
        <img src="{{ url_for('static', filename='results/original.jpg') }}" width="300">
        <p>Binary Mask:</p>
        <img src="{{ url_for('static', filename='results/binary.jpg') }}" width="300">
        <p>Detected Particles:</p>
        <img src="{{ url_for('static', filename='results/detections.jpg') }}" width="300">
    </div>
    {% endif %}
</body>
</html>
